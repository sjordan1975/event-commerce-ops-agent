[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realtime-event-commerce-ops-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "google-adk==2.1.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
