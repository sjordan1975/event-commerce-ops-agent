[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realtime-event-commerce-ops-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "google-adk==2.1.0",
    "google-cloud-storage>=2.0",
    "httpx>=0.27",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pymongo>=4.0",  # direct Atlas access for ops scripts + live smoke tests
    "fastapi>=0.110",  # src/api backend (D-033/D-035)
    "uvicorn>=0.29",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Live tests hit real Atlas and are deselected by default (hermetic CI). Run with: pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: hits the real MongoDB Atlas cluster; deselected by default. Run with -m live (needs MONGODB_URI).",
]
